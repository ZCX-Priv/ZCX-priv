<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">SOLO-Thinker — Security, Systems, Full-Stack</title>
  <desc id="heroDesc">Terminal-style profile banner for SOLO-Thinker, a security engineering learner and full-stack builder.</desc>
  <defs>
    <clipPath id="heroClip">
      <rect x="0.5" y="0.5" width="879" height="299" rx="14" ry="14"/>
    </clipPath>
    <pattern id="heroGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1A7F37" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="heroGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1A7F37" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#2DA44E" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#1A7F37" stop-opacity="0"/>
    </radialGradient>
    <style>
      .hero-cursor { animation: hero-blink 1.2s steps(1, end) infinite; }
      @keyframes hero-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#F5F8F4"/>
    <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="url(#heroGrid)"/>
    <ellipse cx="210" cy="130" rx="330" ry="190" fill="url(#heroGlow)"/>
  </g>

  <rect x="0.5" y="0.5" width="879" height="299" rx="14" stroke="#D5E0D7" stroke-width="1"/>

  <g stroke="#1A7F37" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
    <path d="M24 44V24H44"/>
    <path d="M856 44V24H836"/>
    <path d="M24 256V276H44"/>
    <path d="M856 256V276H836"/>
  </g>

  <g font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="42" y="58" font-size="13" letter-spacing="0.3" fill="#5B6B60">
      <tspan>zcx@priv:~$ </tspan><tspan fill="#1A7F37">whoami</tspan>
    </text>
    <rect class="hero-cursor" x="188" y="46" width="8" height="14" rx="1" fill="#1A7F37"/>

    <text x="40" y="120" font-size="44" font-weight="700" letter-spacing="1.5">
      <tspan fill="#101B14">SOLO</tspan><tspan fill="#1A7F37">-</tspan><tspan fill="#101B14">THINKER</tspan>
    </text>

    <text x="42" y="150" font-size="12" font-weight="600" letter-spacing="3.2" fill="#1A7F37">SECURITY · SYSTEMS · FULL-STACK</text>

    <text x="42" y="188" font-size="15" letter-spacing="0.2" fill="#5B6B60">Mostly learning security, occasionally shipping something.</text>

    <circle cx="45" cy="254" r="3" fill="#1A7F37"/>
    <text x="55" y="258" font-size="12" letter-spacing="0.3" fill="#5B6B60">github.com/ZCX-Priv</text>
    <text x="838" y="258" font-size="10.5" letter-spacing="1.5" fill="#93A398" text-anchor="end">EST. 2025</text>

    <line x1="600" y1="60" x2="600" y2="244" stroke="#D5E0D7" stroke-width="1"/>

    <text x="620" y="82" font-size="11" font-weight="600" letter-spacing="2" fill="#1A7F37">[ SYSTEM ]</text>

    <g font-size="11.5" letter-spacing="0.25">
      <text x="620" y="112" fill="#93A398">UID</text>
      <text x="704" y="112" fill="#101B14">1000</text>
      <text x="620" y="132" fill="#93A398">SHELL</text>
      <text x="704" y="132" fill="#101B14">/bin/zsh</text>
      <text x="620" y="152" fill="#93A398">FOCUS</text>
      <text x="704" y="152" fill="#101B14">security</text>
      <text x="620" y="172" fill="#93A398">STATE</text>
      <text x="704" y="172" fill="#101B14">learning · building</text>
      <text x="620" y="192" fill="#93A398">LOCALE</text>
      <text x="704" y="192" fill="#101B14">UTC+8</text>
    </g>
  </g>
</svg>
